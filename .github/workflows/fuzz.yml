name: fuzz
# A longer run of the parser fuzz targets (src/fuzz.rs) than `cargo test`
# does, with a new seed every time, so each run explores different inputs.
# A failure prints the target, the seed and the input; reproduce it locally
# with: FUZZ_SEED=<seed> FUZZ_ITERS=20000000 cargo test --release --lib fuzz
on:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup ships with the runner images: no third-party action needed.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
      - name: Fuzz the parsers (20 million inputs per target)
        env:
          FUZZ_SEED: ${{ github.run_id }}
          FUZZ_ITERS: "20000000"
        run: |
          echo "seed: $FUZZ_SEED"
          cargo test --locked --offline --release --lib fuzz
