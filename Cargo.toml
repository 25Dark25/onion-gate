[package]
name = "onion-gate"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "A no-JavaScript CAPTCHA gate and reverse proxy for a .onion (or loopback) backend. std only, zero dependencies, 127.0.0.1 only."
license = "MIT"
repository = "https://github.com/25Dark25/onion-gate"
readme = "README.md"
publish = false   # releases are signed tarballs on GitHub, not crates.io
keywords = ["captcha", "tor", "onion", "proxy", "ddos"]
categories = ["web-programming", "network-programming"]

# Zero dependencies, on purpose:
#  - no supply chain to audit but std,
#  - no crate can make a hidden network call,
#  - a small, self-contained binary.
[dependencies]

[features]
# Exposes the fuzz targets (src/fuzz.rs) to an external coverage-guided fuzzer,
# which lives outside this repository. Adds no dependency and nothing to the
# gate itself.
fuzzing = []

[lib]
name = "onion_gate"
path = "src/lib.rs"

[[bin]]
name = "onion-gate"
path = "src/main.rs"

# Local test harness (scripts/harness.sh, docs/TESTING.md). std and this crate
# only; `test = true` makes `cargo test` run their unit tests too.
[[example]]
name = "test_backend"
test = true

[[example]]
name = "circuit_proxy"
test = true

[profile.release]
opt-level = "z"     # minimum size
lto = true
codegen-units = 1
strip = true
# panic = "abort" is NOT set: a panic in a connection thread must kill only that
# connection, not the whole server. (The Mutexes tolerate poisoning.)
