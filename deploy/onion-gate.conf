# Example configuration for onion-gate behind tor. Copy it to
# /etc/onion-gate/onion-gate.conf, set upstream to your backend, and run
#   onion-gate --config=/etc/onion-gate/onion-gate.conf --check
# Generated with --print-config: every value below is the default, except
# upstream and proxy_protocol. Delete any line you do not need to change.

# onion-gate configuration. Every key is optional except upstream; a
# missing key takes its default. Durations: 30s, 5m, 2h. Sizes: 64K, 8M.
# Rates are requests per minute.

# Port to listen on. onion-gate listens on 127.0.0.1 only.
port = 8088

# The backend to protect, host:port. Must resolve to loopback. Required.
upstream = 127.0.0.1:3000

# Read tor's PROXY line (HiddenServiceExportCircuitID haproxy). Needed for per-circuit limits: use yes behind tor.
proxy_protocol = yes

# Port on 127.0.0.1 for aggregate metrics (GET /metrics, Prometheus text). 0 = off. Never point tor at it.
metrics_port = 0

# CAPTCHA rounds in a row needed for a pass (1-5).
rounds = 2

# How long a challenge image is valid; the page shows a bar for it.
challenge_ttl = 30s

# A pass unused for this long expires.
pass_idle = 30m

# A pass expires this long after it was issued, however active.
pass_max = 2h

# Requests one pass may make in a burst. Every request counts, assets included.
pass_burst = 60

# Sustained requests per minute per pass. Spending the budget revokes the pass.
pass_per_minute = 60

# Forwarded requests one Tor circuit may make in a burst. Must exceed pass_burst.
circuit_burst = 90

# Sustained forwarded requests per minute per circuit. Must exceed pass_per_minute.
circuit_per_minute = 90

# Challenge images one circuit may get in a burst (each costs CPU).
challenge_burst = 10

# Sustained challenge images per minute per circuit.
challenge_per_minute = 10

# Simultaneous connections per circuit.
conn_per_circuit = 8

# Simultaneous connections in total.
max_conn = 512

# Largest request body forwarded (with a valid pass).
max_body = 1M

# Largest backend response relayed; larger ones are a 502.
max_response = 8M

# How long the backend may take to answer.
upstream_timeout = 30s

# Request and response bytes buffered at once, in total. Over it: 503.
memory = 128M

# The most one circuit may hold of memory. At least 2 x max_response.
memory_per_circuit = 24M

# The most one pass may hold of memory.
memory_per_pass = 32M

# always: every new visitor solves the CAPTCHA. adaptive: no CAPTCHA while calm, the CAPTCHA for everyone new while under attack (needs proxy_protocol).
captcha = always

# Adaptive: arrivals (requests without a valid pass) per minute that mean an attack.
adaptive_new_per_minute = 60

# Adaptive: time without any attack signal before going back to calm.
adaptive_hold = 15m

# Adaptive: while this file exists the gate stays under attack (touch it to force the CAPTCHA). Empty: none.
adaptive_force_file =
